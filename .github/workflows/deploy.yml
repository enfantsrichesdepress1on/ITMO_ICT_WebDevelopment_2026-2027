
name: Deploy MkDocs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Lab 1
        uses: actions/checkout@v7
        with:
          ref: main
          path: source-main

      - name: Checkout Lab 2
        uses: actions/checkout@v7
        with:
          ref: lr2
          path: source-lr2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install MkDocs
        run: python -m pip install mkdocs

      - name: Build Lab 1
        run: |
          mkdocs build --strict \
            -f source-main/students/K3242/Marusyak_Nikita/laboratory_work1/mkdocs.yml \
            -d "$GITHUB_WORKSPACE/public"

      - name: Build Lab 2
        run: |
          mkdocs build --strict \
            -f source-lr2/students/K3242/Marusyak_Nikita/Lr2/mkdocs.yml \
            -d "$GITHUB_WORKSPACE/public/lr2"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
